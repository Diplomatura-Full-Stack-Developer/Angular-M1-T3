<mat-card class="example-card justify-center items-center" appearance="outlined">
  <mat-card-header class="text-center my-2">
    <mat-card-title class="text-lg font-bold text-shadow-sm text-primary-600">{{
      product.type
    }}</mat-card-title>
    <mat-card-subtitle class="text-sm text-secondary-500! font-bold text-shadow-sm">{{
      product.brand
    }}</mat-card-subtitle>
  </mat-card-header>
  <img mat-card-lg-image [src]="product.imageUrl" alt="Photo of a Shiba Inu" />
  <mat-card-content class="text-sm text-gray-700 text-shadow-sm my-2">
    <p>{{ product.price | currency: '$ ' }}</p>
    <p>{{ product.stock > 0 ? 'Stock Disponible' : 'Stock Agotado' }}</p>
    <p>{{ product.offer ? '12 Cuotas sin interes' : '' }}</p>
    <p>{{ product.features.join(', ') }}</p>
  </mat-card-content>
  <mat-card-actions>
    <button matButton class="bg-accent-600 text-white" (click)="deleteProduct(product.model)">
      Eliminar
    </button>
  </mat-card-actions>
</mat-card>
